<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E4A72"/>
      <stop offset="1" stop-color="#122C47"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 档案深蓝圆角底板 -->
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#sheen)"/>
  <rect x="70" y="70" width="884" height="884" rx="198" fill="none" stroke="#F5F0E5" stroke-opacity="0.14" stroke-width="3"/>

  <!-- 作图起点：两条相交弧线 -->
  <g fill="none" stroke="#F2ECDD" stroke-linecap="round">
    <path d="M 272 512 A 240 240 0 0 1 752 512" stroke-width="54"/>
    <path d="M 512 272 A 240 240 0 0 1 512 752" stroke-width="54" stroke-opacity="0.55"/>
  </g>

  <!-- 朱砂红定位点 -->
  <circle cx="512" cy="512" r="36" fill="#C0503A"/>
  <circle cx="512" cy="512" r="36" fill="none" stroke="#F2ECDD" stroke-opacity="0.85" stroke-width="10"/>
</svg>
